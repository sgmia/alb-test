apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-test
  labels:
    app: alb-test
spec:
  ingressClassName: alb-test
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alb-test
                port:
                  number: 8080
